<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 500" role="img" aria-labelledby="title"><title id="title">リズムに弾む、ひだりのしかくとみぎのまる</title><style>.left{transform-origin:185px 235px;animation:left 1.2s ease-out infinite}.right{transform-origin:420px 250px;animation:right .8s ease-out infinite}@keyframes left{0%{transform:translateY(-14px) rotate(-4deg)}35%,100%{transform:translateY(0)}}@keyframes right{0%{transform:translateY(-14px) scale(1.025)}35%,100%{transform:translateY(0)}}@media(prefers-reduced-motion:reduce){.left,.right{animation:none}}</style><defs><linearGradient id="b" x2=".2" y2="1"><stop stop-color="#5275ff"/><stop offset="1" stop-color="#2952e8"/></linearGradient><linearGradient id="o" x2=".2" y2="1"><stop stop-color="#ff794e"/><stop offset="1" stop-color="#fa4c21"/></linearGradient></defs><ellipse cx="300" cy="340" rx="274" ry="66" fill="none" stroke="#1c252c" stroke-opacity=".08"/><g class="left"><g transform="rotate(-10 185 235)"><rect x="75" y="125" width="220" height="220" rx="59" fill="url(#b)"/><rect x="156" y="237" width="12" height="22" rx="6" fill="white"/><rect x="201" y="237" width="12" height="22" rx="6" fill="white"/></g></g><g class="right"><circle cx="425" cy="251" r="110" fill="url(#o)"/><rect x="396" y="252" width="12" height="22" rx="6" fill="white"/><rect x="441" y="252" width="12" height="22" rx="6" fill="white"/></g><g font-family="-apple-system, sans-serif" font-size="18" font-weight="600" text-anchor="middle"><text x="185" y="426" fill="#2952e8">しかくは、ひだり。</text><text x="425" y="426" fill="#e53e13">まるは、みぎ。</text></g></svg>
